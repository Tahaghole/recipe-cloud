<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe Master</title>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍽 Recipe Master</h1>
    <button id="logoutBtn" class="btn logout-btn hidden">Logout</button>
  </header>

  <div class="container">
    <aside>
      <button id="viewSavedMeals" class="btn hidden">View Saved Meals</button>
      <button id="viewGroceryList" class="btn hidden">View Grocery List</button>
    </aside>

    <main>
      <div id="authSection">
        <h2 id="welcomeText">Sign in or Sign up to continue</h2>
        <div id="authForm">
          <button id="loginBtn" class="btn">Login</button>
          <button id="signupBtn" class="btn">Signup</button>
        </div>
      </div>

      <div id="mainContent" class="hidden">
        <button id="getMeal" class="btn">🍔 Get Meal</button>
        <div id="mealContainer"></div>
        <div id="savedMealsContainer"></div>
      </div>
    </main>
  </div>

  <!-- Modal for Grocery List -->
  <div id="groceryModal" class="modal hidden">
    <h3>Your Grocery List</h3>
    <ul id="groceryListItems"></ul>
    <button class="btn" onclick="toggleGroceryModal()">Close</button>
  </div>
  <div id="modalOverlay" class="overlay hidden" onclick="toggleGroceryModal()"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script src="app.js"></script>
</body>
</html>
